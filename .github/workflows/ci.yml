name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build plugin
        shell: pwsh
        run: dotnet build Chatstronomy.NINA/Chatstronomy.NINA.csproj --configuration Release

      - name: Run standalone compatibility tests
        shell: pwsh
        run: dotnet run --project Chatstronomy.NINA.Tests/Chatstronomy.NINA.Tests.csproj --configuration Release

      - name: Validate archive and manifest generation
        shell: pwsh
        run: |
          $arguments = @{
            Version = '0.1.0.17'
            SkipRuntime = $true
            InstallerUrl = 'https://example.invalid/Chatstronomy.NINA.0.1.0.17.zip'
            FeaturedImageUrl = 'https://example.invalid/chatstronomy-featured.png'
          }
          ./build-package.ps1 @arguments -StageOnly
          if (-not (Test-Path -LiteralPath 'artifacts/nina-plugin/package/Chatstronomy/Chatstronomy.dll' -PathType Leaf)) {
            throw 'StageOnly did not produce the plugin DLL.'
          }
          ./build-package.ps1 @arguments -PackageOnly

      - name: Validate GitHub development plugin repository
        shell: pwsh
        run: |
          $entries = @(Get-Content -LiteralPath 'registry/plugins/manifests' -Raw | ConvertFrom-Json)
          if ($entries.Count -ne 1 -or
              $entries[0].Identifier -ne '5e7c25c4-f654-4e22-9e21-3127048221c0') {
            throw 'Development repository must contain exactly the Chatstronomy manifest.'
          }
          $installer = $entries[0].Installer
          if ($installer.URL -notmatch '^https://github\.com/theatrus/chatstronomy-nina-plugin/releases/download/' -or
              $installer.Checksum -notmatch '^[0-9A-Fa-f]{64}$' -or
              $installer.ChecksumType -ne 'SHA256' -or
              $installer.Type -ne 'ARCHIVE') {
            throw 'Development repository installer metadata is invalid.'
          }
          $archive = Join-Path $env:RUNNER_TEMP 'chatstronomy-development-plugin.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $installer.URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if (-not $actual.Equals([string] $installer.Checksum, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Development package checksum mismatch: $actual"
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'chatstronomy-development-plugin'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $runtime = Join-Path $expanded 'runtime/chatstronomy.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*StackFoundry LLC*') {
            throw "Development runtime signature is $($signature.Status): $($signature.SignerCertificate.Subject)"
          }

      - name: Inspect runtime lock
        id: runtime_lock
        shell: pwsh
        run: |
          $lock = Get-Content -LiteralPath runtime.lock.json -Raw | ConvertFrom-Json
          $locked = if ($lock.state -eq 'locked') { 'true' } else { 'false' }
          "locked=$locked" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Runtime lock state: $($lock.state)"

      - name: Run pinned backend integration tests
        if: steps.runtime_lock.outputs.locked == 'true'
        shell: pwsh
        run: |
          $runtime = ./fetch-runtime.ps1 | Select-Object -Last 1
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime.Runtime
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*StackFoundry LLC*') {
            throw "Pinned runtime signature is $($signature.Status): $($signature.SignerCertificate.Subject)"
          }
          $env:CHATSTRONOMY_RUNTIME_EXE = $runtime.Runtime
          $env:CHATSTRONOMY_HUB_EXE = $runtime.HubProbe
          $env:CHATSTRONOMY_CONTRACTS_DIR = $runtime.Contracts
          dotnet run --project Chatstronomy.NINA.Tests/Chatstronomy.NINA.Tests.csproj --configuration Release
          ./build-package.ps1 -Version 0.1.0.17 -RuntimePath $runtime.Runtime

      - name: Upload package smoke-test
        uses: actions/upload-artifact@v7
        with:
          name: chatstronomy-nina-package-smoke-test
          path: |
            artifacts/nina-plugin/Chatstronomy.NINA.0.1.0.17.zip
            artifacts/nina-plugin/Chatstronomy.NINA.0.1.0.17.manifest.json
