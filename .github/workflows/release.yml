name: Release

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Test and publish plugin
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Resolve plugin version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+\.\d+)$') {
            throw "Plugin release tags must be v followed by four numeric parts. Got: $tag"
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Fetch pinned backend artifacts
        id: runtime
        shell: pwsh
        run: |
          $runtime = ./fetch-runtime.ps1 | Select-Object -Last 1
          "runtime=$($runtime.Runtime)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "hub_probe=$($runtime.HubProbe)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "contracts=$($runtime.Contracts)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run full compatibility suite
        shell: pwsh
        env:
          CHATSTRONOMY_RUNTIME_EXE: ${{ steps.runtime.outputs.runtime }}
          CHATSTRONOMY_HUB_EXE: ${{ steps.runtime.outputs.hub_probe }}
          CHATSTRONOMY_CONTRACTS_DIR: ${{ steps.runtime.outputs.contracts }}
        run: dotnet run --project Chatstronomy.NINA.Tests/Chatstronomy.NINA.Tests.csproj --configuration Release

      - name: Build N.I.N.A. archive and manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $archiveName = "Chatstronomy.NINA.$version.zip"
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$archiveName"
          ./build-package.ps1 `
            -Version $version `
            -RuntimePath '${{ steps.runtime.outputs.runtime }}' `
            -InstallerUrl $installerUrl `
            -Channel Beta

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Chatstronomy for N.I.N.A. ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/nina-plugin/Chatstronomy.NINA.${{ steps.version.outputs.version }}.zip
            artifacts/nina-plugin/Chatstronomy.NINA.${{ steps.version.outputs.version }}.manifest.json
